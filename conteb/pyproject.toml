[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = ["cde_benchmark"]

[project]
name = "cde_benchmark"
version = "0.0.0"
description = "The code used to train and run inference with the OptimusVLM architecture."
authors = [
    { name = "Manuel Faysse", email = "manuel.faysse@illuin.tech" },
]
maintainers = [
    { name = "Manuel Faysse", email = "manuel.faysse@illuin.tech" },
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0",
    "mteb>=1.16.3,<1.29.0",
    "datasets>=2.19.1",
    "sentence_transformers>=3.3.1",
    "voyageai>=0.5.0; python_version < '3.13'",
    "peft>=0.14.0",
    "transformers>=4.51.0",
    "contextual-embeddings",
]

[project.optional-dependencies]


dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

all = ["cde_benchmark"]

[project.urls]
homepage = "https://github.com/ManuelFay/contextualized-embeddings-benchmark"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch>=2.8.0,<2.9.0"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[tool.uv.sources]
contextual-embeddings = { path = "../contextual-embeddings", editable = true }

[tool.pytest.ini_options]
filterwarnings = ["ignore::Warning"]
markers = ["slow: marks test as slow"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
