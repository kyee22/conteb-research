[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
include = ["contextual_embeddings"]

[project]
name = "contextual_embeddings"
version = "0.0.1"
description = "This is the package used to model contextualized embeddings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.7.0",
    "configue>=5.0.0",
    "datasets>=3.2.0",
    "flash-attn==2.8.3.post1",
    "numpy<2",
    "pylate>=1.2.0",
    "sentence-transformers>=3.3.1",
    "torch>=2.8.0,<2.9.0",
    "transformers>=4.47.1",
    "typer>=0.15.1",
    "wandb>=0.28.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
]
no-build-isolation-package = ["flash-attn"]

[tool.uv.extra-build-dependencies]
# Ensure flash-attn's isolated build sees the same CUDA 12.8 PyTorch wheel
# used at runtime (otherwise uv may select a newer CPU/CUDA variant).
flash-attn = ["torch>=2.8.0,<2.9.0"]


[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
