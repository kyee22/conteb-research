# Hypernetwork variant of modernbert.yaml. The original configuration is unchanged.
multi_ctx_training: True
base_model:
  (): sentence_transformers.SentenceTransformer
  model_name_or_path: "lightonai/modernbert-embed-large"
  model_kwargs:
    attn_implementation: "flash_attention_2"
    torch_dtype: !ext torch.bfloat16

config:
  (): contextual_embeddings.ContextualTrainingConfig
  add_prefixes: True
  model:
    (): contextual_embeddings.HyperContextEmbeddingModel
    base_model: !cfg base_model
    multi_ctx_training: !cfg multi_ctx_training
    hypernet_type: "full"  # "lora" is also supported
    hypernet_rank: 64
    chunk_encoding_mode: "late"  # "separate" independently encodes each chunk
    query_micro_batch_size: 16
  multi_ctx_training: !cfg multi_ctx_training
  loss_type: "infonce"  # use "weighted" to retain the original weighted loss
  exp_name: "modernbert-hypernet"
  n_gpus: 2
  output_dir: "./checkpoints/test"
  train_dataset:
    (): contextual_embeddings.models.utils.get_long_context_dataset
    base_model: !cfg base_model
  eval_dataset: 
    mldr:
      (): contextual_embeddings.models.utils.create_contextual_dataset 
      path: "illuin-conteb/mldr-conteb-train"
      split: "test"
      base_model: !cfg base_model
    squad:
      (): contextual_embeddings.models.utils.create_contextual_dataset
      path: "illuin-conteb/squad-conteb-train"
      split: "validation"
      base_model: !cfg base_model
      all_queries: False
    narrative_qa:
      (): contextual_embeddings.models.utils.create_contextual_dataset 
      path: "illuin-conteb/narrative-qa"
      split: "test"
      base_model: !cfg base_model
      all_queries: False
  run_train: True
  training_args:
    (): sentence_transformers.SentenceTransformerTrainingArguments
    output_dir: null
    num_train_epochs: 2
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 4
    bf16: True
    gradient_checkpointing: True
    gradient_checkpointing_kwargs:
      use_reentrant: False
    ddp_find_unused_parameters: False
    learning_rate: 5e-5
    warmup_ratio: 0.05
    lr_scheduler_type: "cosine"
    eval_strategy: "steps"
    eval_on_start: True
    eval_steps: 100
    logging_steps: 10
    report_to: "wandb"
